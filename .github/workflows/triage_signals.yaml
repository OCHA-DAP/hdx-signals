name: Triage Signals

on:
  workflow_dispatch:
    inputs:
      HS_DRY_RUN:
        required: true
        type: choice
        default: "TRUE"
        options:
          - "TRUE"
          - "FALSE"
      HS_LOCAL:
        required: true
        type: choice
        default: "TRUE"
        options:
          - "TRUE"
          - "FALSE"
      LOG_LEVEL:
        required: true
        type: choice
        default: "DEBUG"
        options:
          - "DEBUG"
          - "INFO"
          - "WARNING"
          - "ERROR"
      USER_COMMAND:
        required: true
        type: choice
        default: "DO_NOTHING"
        options:
          - "DO_NOTHING"
          - "APPROVE"
          - "DELETE"
          - "ARCHIVE"
      USER_COMMAND_CONFIRMATION:
        required: true
        type: choice
        default: "DONT CONFIRM"
        options:
          - "DONT CONFIRM"
          - "I CONFIRM"
      INDICATOR_ID:
        required: true
        type: choice
        default: "acled_conflict"
        options:
          - "acled_conflict"
          - "acaps_inform_severity"
          - "idmc_displacement_conflict"
          - "idmc_displacement_disaster"
          - "ipc_food_insecurity"
          - "jrc_agricultural_hotspots"
          - "wfp_market_monitor"
          - "who_cholera"
      TEST:
        required: true
        type: choice
        default: "FALSE"
        options:
          - "FALSE"
          - "TRUE"
  push:
    branches:
    - '**'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HS_EMAIL: ${{ secrets.HS_EMAIL }}
      HS_SURVEY_LINK: ${{ secrets.HS_SURVEY_LINK }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
      DSCI_AZ_BLOB_PROD_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS_WRITE }}
      MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
      HS_LOCAL: ${{ inputs.HS_LOCAL || 'FALSE' }}
      HS_FIRST_RUN: ${{ inputs.HS_FIRST_RUN || 'FALSE' }}
      HS_DRY_RUN: ${{ inputs.HS_DRY_RUN || 'FALSE' }}
      LOG_LEVEL: ${{ inputs.LOG_LEVEL || 'INFO' }}
      INDICATOR_ID: ${{ inputs.INDICATOR_ID }}
      TEST: ${{ inputs.TEST || 'TRUE' }}
      USER_COMMAND: ${{ inputs.USER_COMMAND || 'DO_NOTHING' }}
      USER_COMMAND_CONFIRMATION: ${{ inputs.USER_COMMAND_CONFIRMATION || 'I CONFIRM' }}
      HS_ADMIN_NAME: ${{ secrets.HS_ADMIN_NAME }}
      HS_HDX_BEARER: ${{ secrets.HS_HDX_BEARER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up environment
        uses: ocha-dap/hdx-signals-actions@v3

      - name: Run R monitoring script
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          timeout_minutes: 5
          retry_on: error
          retry_wait_seconds: 120
          shell: bash
          command: Rscript ./src/run/run_triage_signals.R

      # `update_homepage_signals()` writes to a repository file rather than to
      # Azure, so the approved signal is only displayed on the HDX homepage once
      # it is merged. `main` requires a pull request, which the Actions token
      # cannot bypass, so the run opens one instead of pushing. Restricted to
      # manual runs, where the triaged branch is the one to update.
      - name: Open a pull request with the latest signals for the HDX homepage
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEPAGE_SIGNALS_FILE: output/hdx_signals_latest3.csv
          HOMEPAGE_SIGNALS_BRANCH: homepage-signals/${{ github.run_id }}
          TRIAGED_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain "$HOMEPAGE_SIGNALS_FILE")" ]; then
            echo "No changes to $HOMEPAGE_SIGNALS_FILE, nothing to open a pull request for."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$HOMEPAGE_SIGNALS_BRANCH"
          git add "$HOMEPAGE_SIGNALS_FILE"
          git commit -m "Data: update latest signals for the HDX homepage"
          git push origin "$HOMEPAGE_SIGNALS_BRANCH"

          cat > pr_body.md <<BODY
          Adds the signal approved when triaging \`$INDICATOR_ID\` to
          \`$HOMEPAGE_SIGNALS_FILE\`, dropping the oldest so the three latest
          remain. Merge to update the HDX homepage.

          Opened automatically by [this triage run]($RUN_URL).
          BODY

          gh pr create \
            --base "$TRIAGED_BRANCH" \
            --head "$HOMEPAGE_SIGNALS_BRANCH" \
            --title "Data: update latest signals for the HDX homepage ($INDICATOR_ID)" \
            --body-file pr_body.md

          rm pr_body.md
