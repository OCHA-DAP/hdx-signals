# this workflow lints the repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: Lint

permissions: read-all

jobs:
  lint:
      runs-on: ubuntu-latest
      env:
          HS_EMAIL: ${{ secrets.HS_EMAIL}}
          HS_SURVEY_LINK: ${{ secrets.HS_SURVEY_LINK}}
          IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
          IDMC_API: ${{ secrets.IDMC_API }}
          CERF_CHOLERA_DATA: ${{ secrets.CERF_CHOLERA_DATA }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_AZ_BLOB_PROD_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS_WRITE }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          HS_LOCAL: ${{ inputs.HS_LOCAL || 'FALSE' }}
          HS_FIRST_RUN: ${{ inputs.HS_FIRST_RUN || 'FALSE' }}
          HS_DRY_RUN: ${{ inputs.HS_DRY_RUN || 'FALSE' }}
          LOG_LEVEL: ${{ inputs.LOG_LEVEL || 'DEBUG' }}
      steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Set up environment
            uses: ocha-dap/hdx-signals-actions@v3

          - name: Install extra dependencies
            shell: Rscript {0}
            # pinned to the versions in renv.lock: installing "latest" here let
            # new lintr/box.linters CRAN releases break this workflow
            # independently of any code change (e.g. lintr 3.4.0 introduced an
            # indentation_linter crash - "replacement has length zero" - not
            # present in the pinned 3.3.0-1)
            run: |
              install.packages("remotes")
              remotes::install_version("lintr", version = "3.3.0-1", repos = "https://cloud.r-project.org")
              remotes::install_version("box.linters", version = "0.10.7", repos = "https://cloud.r-project.org")

          - name: Lint
            run: lintr::lint_dir()
            shell: Rscript {0}
            env:
              LINTR_ERROR_ON_LINT: true
