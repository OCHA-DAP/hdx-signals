# this workflow lints the repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: Lint

permissions: read-all

jobs:
  lint:
      runs-on: ubuntu-latest
      env:
          HS_EMAIL: ${{ secrets.HS_EMAIL}}
          HS_SURVEY_LINK: ${{ secrets.HS_SURVEY_LINK}}
          IPC_API_KEY: ${{ secrets.IPC_API_KEY }}
          IDMC_API: ${{ secrets.IDMC_API }}
          CERF_CHOLERA_DATA: ${{ secrets.CERF_CHOLERA_DATA }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_AZ_BLOB_PROD_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS_WRITE }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          HS_LOCAL: ${{ inputs.HS_LOCAL || 'FALSE' }}
          HS_FIRST_RUN: ${{ inputs.HS_FIRST_RUN || 'FALSE' }}
          HS_DRY_RUN: ${{ inputs.HS_DRY_RUN || 'FALSE' }}
          LOG_LEVEL: ${{ inputs.LOG_LEVEL || 'DEBUG' }}
      steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Set up environment
            uses: ocha-dap/hdx-signals-actions@v3

          - name: Install extra dependencies
            shell: Rscript {0}
            # pinned to the exact renv.lock versions via a dated Posit Package
            # Manager snapshot (prebuilt Linux binaries, same host used
            # elsewhere in this workflow via RSPM) - installing "latest" here
            # let new lintr/box.linters CRAN releases break this workflow
            # independently of any code change (e.g. lintr 3.4.0, released
            # 2026-07-16, introduced an indentation_linter crash -
            # "replacement has length zero" - not present in the pinned
            # 3.3.0-1). The snapshot date falls after box.linters 0.10.7
            # (2025-12-09) and before lintr 3.4.0 (2026-07-16), so both
            # resolve to the renv.lock-pinned versions as binaries, with no
            # source compilation needed.
            run: |
              install.packages(
                c("lintr", "box.linters"),
                repos = "https://packagemanager.posit.co/cran/__linux__/noble/2026-06-01"
              )

          - name: Lint
            run: lintr::lint_dir()
            shell: Rscript {0}
            env:
              LINTR_ERROR_ON_LINT: true
